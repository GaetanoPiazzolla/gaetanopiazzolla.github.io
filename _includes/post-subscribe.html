<div class="post-subscribe">
  <div class="subscribe-links-simple">
    <a href="{{ '/feed.xml' | relative_url }}" target="_blank" class="simple-link">
      [rss]
    </a>
    <a href="https://github.com/{{ site.github_username }}/{{ site.github_username }}.github.io" target="_blank" class="simple-link">
      [src]
    </a>
    <a href="https://medium.com/@gae-piaz" target="_blank" class="simple-link">
      [medium]
    </a>
    <a href="https://raw.githubusercontent.com/GaetanoPiazzolla/gaetanopiazzolla.github.io/master/{{ page.path }}" onclick="downloadMarkdown(event, this.href, '{{ page.title | slugify }}.md')" target="_blank" class="simple-link">
      [.md]
    </a>
  </div>
</div>

<style>
.post-subscribe {
  text-align: center;
  margin: 20px 0;
}

.subscribe-links-simple {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.simple-link {
  color: #00cc66;
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85em;
  transition: color 0.2s ease;
}

.simple-link:hover {
  color: #1a1a1a;
  text-decoration: underline;
}

@media (max-width: 768px) {
  .subscribe-links-simple {
    gap: 15px;
  }
}
</style>
