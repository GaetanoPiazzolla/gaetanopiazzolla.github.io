{%- comment -%}
Renders a post image. Caption falls back to alt so every image gets a subtitle;
pass caption="false" for the rare decorative image that should not have one.
{%- endcomment -%}
{%- assign image_caption = include.caption | default: include.alt -%}
<figure class="post-image-container">
    <img src="{{ include.src }}" class="post-image lightbox-trigger" alt="{{ include.alt }}"
        {%- if include.width %} width="{{ include.width }}"{% endif %} loading="lazy" decoding="async">
    {%- if image_caption and image_caption != "false" %}
    <figcaption class="post-image-subtitle">{{ image_caption }}</figcaption>
    {%- endif %}
</figure>
